<head>

    <style>
        :root {
            --primary-orange: #FF8C00;
            --light-orange: #FFF5EE;
            --dark-orange: #E67E22;
            --success-color: #2ECC71;
            --error-color: #E74C3C;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--light-orange);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.15);
            border: 2px solid var(--primary-orange);
            text-align: center;
            position: relative;
        }
        h1 {
            color: var(--dark-orange);
            margin-bottom: 5px;
        }
        .cat-decoration {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .form-group {
            margin: 20px 0;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--dark-orange);
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus, input[type="number"]:focus {
            border-color: var(--primary-orange);
            outline: none;
        }
        .btn {
            background-color: var(--primary-orange);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: var(--dark-orange);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-home {
            background-color: #95a5a6;
            margin-top: 20px;
        }
        .btn-home:hover {
            background-color: #7f8c8d;
        }
        .quiz-progress {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        .word-display {
            font-size: 32px;
            font-weight: bold;
            color: var(--dark-orange);
            margin: 20px 0;
        }
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .choice-btn {
            background-color: var(--primary-orange);
            color: white;
            border: 2px solid var(--primary-orange);
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-weight: bold;
            transition: all 0.2s;
        }
        .choice-btn:hover:not(:disabled) {
            background-color: var(--dark-orange);
            border-color: var(--dark-orange);
        }
        .choice-btn.correct {
            background-color: var(--success-color) !important;
            border-color: var(--success-color) !important;
        }
        .choice-btn.incorrect {
            background-color: var(--error-color) !important;
            border-color: var(--error-color) !important;
        }
        .feedback-message {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
            min-height: 30px;
        }
        .feedback-message.correct { color: var(--success-color); }
        .feedback-message.incorrect { color: var(--error-color); }
    </style>
</head>
<body>

<div class="container">
    <h1>英検3級 単語クイズ (1501-2000)</h1>
    <div class="cat-decoration">🐾 🐱 🐾</div>

    <div id="home-screen" class="screen active">
        <p>レベルと問題数を選んでスタートするニャ！</p>
        <div class="form-group">
            <label for="level-select">レベルを選択：</label>
            <select id="level-select">
                <option value="all">すべて</option>
                <option value="初級">初級</option>
                <option value="中級">中級</option>
                <option value="上級">上級</option>
            </select>
        </div>
        <div class="form-group">
            <label for="question-count">出題問題数：</label>
            <input type="number" id="question-count" min="1" max="500" value="10">
            <small style="color:#7f8c8d;" id="max-info"></small>
        </div>
        <button class="btn" onclick="startQuiz()">クイズスタート 🐾</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="quiz-progress" id="progress-text">第 1 問</div>
        <div class="word-display" id="word-text"></div>
        <div class="choices-grid" id="choices-container"></div>
        <div id="feedback" class="feedback-message"></div>
        <button id="next-btn" class="btn" onclick="nextQuestion()" style="display:none;">次の問題へ 🐾</button>
        <button class="btn btn-home" onclick="confirmGoHome()">ホームに戻る 🐱</button>
    </div>

    <div id="result-screen" class="screen">
        <h2>結果発表</h2>
        <div class="word-display" id="score-text"></div>
        <p id="result-comment"></p>
        <button class="btn" onclick="goHome()">もう一度あそぶ 🐾</button>
    </div>
</div>

const allJapaneseMeanings = wordsData.map(w => w.japanese);
let currentQuizWords = [];
let currentIndex = 0;
let score = 0;
let isAnswered = false;
document.getElementById('max-info').innerText = ※このファイルには全 ${wordsData.length} 単語が収録されています。;
function startQuiz() {
const selectedLevel = document.getElementById('level-select').value;
let requestedCount = parseInt(document.getElementById('question-count').value);
if (selectedLevel === 'all') {
currentQuizWords = [...wordsData];
} else {
currentQuizWords = wordsData.filter(w => w.level === selectedLevel);
}
if (currentQuizWords.length === 0) {
alert("該当するレベルの単語がありません。");
return;
}
currentQuizWords.sort(() => Math.random() - 0.5);
if (isNaN(requestedCount) || requestedCount <= 0) {
requestedCount = 10;
}
if (requestedCount > currentQuizWords.length) {
requestedCount = currentQuizWords.length;
}
currentQuizWords = currentQuizWords.slice(0, requestedCount);
currentIndex = 0;
score = 0;
showScreen('quiz-screen');
showQuestion();
}
function showQuestion() {
isAnswered = false;
document.getElementById('next-btn').style.display = 'none';
document.getElementById('feedback').innerText = '';
document.getElementById('feedback').className = 'feedback-message';
const currentWord = currentQuizWords[currentIndex];
document.getElementById('progress-text').innerText = 第 ${currentIndex + 1} 問 / ${currentQuizWords.length} 問 [${currentWord.level}];
document.getElementById('word-text').innerText = currentWord.english;
let choices = [currentWord.japanese];
const wrongMeanings = allJapaneseMeanings.filter(m => m !== currentWord.japanese);
wrongMeanings.sort(() => Math.random() - 0.5);
for (let i = 0; i < 3; i++) {
if (wrongMeanings[i]) choices.push(wrongMeanings[i]);
}
choices.sort(() => Math.random() - 0.5);
const container = document.getElementById('choices-container');
container.innerHTML = '';
choices.forEach(choice => {
const button = document.createElement('button');
button.className = 'choice-btn';
button.innerText = choice;
button.onclick = () => checkAnswer(button, choice, currentWord.japanese);
container.appendChild(button);
});
}
function checkAnswer(selectedButton, chosenMeaning, correctMeaning) {
if (isAnswered) return;
isAnswered = true;
const container = document.getElementById('choices-container');
const buttons = container.getElementsByClassName('choice-btn');
const feedback = document.getElementById('feedback');
for (let btn of buttons) {
btn.disabled = true;
if (btn.innerText === correctMeaning) {
btn.classList.add('correct');
}
}
if (chosenMeaning === correctMeaning) {
selectedButton.classList.add('correct');
feedback.innerText = "正解だニャ！🎉";
feedback.className = "feedback-message correct";
score++;
} else {
selectedButton.classList.add('incorrect');
feedback.innerText = ザンネン、不正解…😢 正解は「${correctMeaning}」だニャ;
feedback.className = "feedback-message incorrect";
}
document.getElementById('next-btn').style.display = 'block';
}
function nextQuestion() {
currentIndex++;
if (currentIndex < currentQuizWords.length) {
showQuestion();
} else {
showResult();
}
}
function showResult() {
showScreen('result-screen');
document.getElementById('score-text').innerText = ${currentQuizWords.length}問中 ${score}問 正解！;
const rate = score / currentQuizWords.length;
let comment = "";
if (rate === 1) comment = "素晴らしいニャ！満点パーフェクトだニャ！🐾🐱🐾";
else if (rate >= 0.7) comment = "すごいニャ！その調子でがんばるニャ！👍";
else if (rate >= 0.4) comment = "あともう一息ニャ！復習してみるニャ📚";
else comment = "これから一緒に覚えていけば大丈夫ニャ🐾";
document.getElementById('result-comment').innerText = comment;
}
function confirmGoHome() {
if (confirm("ホームに戻ると現在のクイズデータが消えるけど大丈夫かニャ？")) {
goHome();
}
}
function goHome() {
showScreen('home-screen');
}
function showScreen(screenId) {
document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
document.getElementById(screenId).classList.add('active');
}
